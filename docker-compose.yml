services:
  research-pipeline:
    build: .
    env_file:
      - .env
    volumes:
      # The app writes to CACHE_DIR, which defaults to .cache — the mount must match.
      - ./.cache:/app/.cache
    # Runs the application end to end. To run the test suite instead:
    #   docker compose run --rm --entrypoint pytest research-pipeline
    command: ["ask", "What is photosynthesis and what are its main stages?"]
